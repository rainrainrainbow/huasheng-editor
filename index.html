<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小雨排版器 · 公众号 Markdown 排版工具</title>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/themes-preview.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">🥜</span>
        <span class="title">小雨排版器</span>
        <span class="subtitle">公众号 Markdown 排版</span>
      </div>
      <div class="actions">
        <select id="themeSelect" class="theme-select" title="选择主题"></select>
        <button id="copyBtn" class="btn btn-primary">📋 复制到公众号</button>
        <button id="clearBtn" class="btn btn-ghost" title="清空">清空</button>
      </div>
    </header>

    <!-- 移动端标签切换（桌面隐藏） -->
    <div class="mobile-tabs">
      <button class="mobile-tab active" data-pane="editor">✍️ 编辑</button>
      <button class="mobile-tab" data-pane="preview">📱 预览</button>
    </div>

    <!-- 主体：左编辑右预览 -->
    <main class="workspace">
      <section class="editor-pane">
        <div class="pane-header">
          <span>✍️ Markdown 编辑</span>
          <span class="hint">支持标准 Markdown + 微信组件</span>
        </div>
        <textarea id="editor" placeholder="在此输入 Markdown..."></textarea>
      </section>

      <section class="preview-pane">
        <div class="pane-header">
          <span>📱 微信预览</span>
          <span id="charCount" class="hint">0 字</span>
        </div>
        <div class="phone-frame">
          <div id="preview" class="preview-content"></div>
        </div>
      </section>
    </main>

    <!-- 底部工具条 -->
    <footer class="toolbar">
      <div class="tool-group">
        <span class="tool-label">字号</span>
        <input type="range" id="fontSize" min="14" max="18" step="1" value="16">
        <span id="fontSizeVal" class="tool-val">16px</span>
      </div>
      <div class="tool-group">
        <span class="tool-label">主题色</span>
        <div id="accentColors" class="accent-colors"></div>
      </div>
      <div class="tool-group">
        <button class="tool-btn" data-insert="tip">💡 提示框</button>
        <button class="tool-btn" data-insert="quote">📝 引用卡</button>
        <button class="tool-btn" data-insert="divider">➖ 分割线</button>
        <button class="tool-btn" data-insert="image">🖼️ 图片</button>
        <button class="tool-btn" data-insert="code">💻 代码块</button>
      </div>
    </footer>
  </div>

  <!-- 提示 toast -->
  <div id="toast" class="toast"></div>

  <!-- 依赖（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.js"></script>

  <!-- 主题定义 -->
  <script src="src/themes/themes.js"></script>
  <!-- 核心转换引擎 -->
  <script src="src/js/converter.js"></script>
  <!-- 主逻辑 -->
  <script src="src/js/app.js"></script>
</body>
</html>
